# Google's deb ships a setuid chrome-sandbox helper that the recipe
# template strips, and the pod seccomp profile blocks the user-namespace
# fallback — Chrome runs with --no-sandbox: the pod is the sandbox
# boundary (HARDENING.md).
name: chrome
layer: apps
from: core-ubuntu-noble
description: >
  Google Chrome (dl.google.com APT repo, fingerprint pinned) in a
  single-app kiosk session — no desktop behind it; the pod is the
  sandbox boundary (inner Chrome sandbox disabled).
icon: google-chrome
displayName: Google Chrome

# Google publishes no arm64 Chrome deb (re-checked 2026-07-17).
archs: [linux/amd64]

recipe:
  apt: [google-chrome-stable]
  app: google-chrome-stable --no-sandbox
  repo:
    url: https://dl.google.com/linux/chrome/deb/
    keyUrl: https://dl.google.com/linux/linux_signing_key.pub
    fingerprint: "EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796"
    pin: "google-chrome*"

variants:
  - name: chrome
    smoke:
      vnc: true
