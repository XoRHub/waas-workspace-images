# One variant, -dev only (reduced profile, `sudo apt install` in-session):
# Hermes installs its dependencies at runtime and exists to install tools,
# so a hardened variant that forbids exactly that is not meaningful. Those
# installs die with the pod, only /home/waas_user (and so ~/.hermes)
# survives.
name: hermes-agent
layer: apps
from: core-ubuntu-noble
buildContexts:
  firefox: shared/firefox
  mise: shared/mise
description: >
  Hermes Agent (Nous Research) in its native desktop app — self-improving
  AI agent; keys, sessions, memories and skills persist in ~/.hermes on
  the home volume, and mise installs extra toolchains there too, so they
  survive pod restarts.
# dashboard-icons canonical slug ("hermes-agent" is only an alias, 404 on the CDN).
icon: hermes

# Catalog env hint no protocol table can surface (merged by
# ci/generate_catalog.py on top of the smoke-derived ones).
env:
  - name: WAAS_HERMES_DASHBOARD
    description: >-
      Boolean '1'/'0'. '1' serves the Hermes web dashboard (127.0.0.1:9119)
      and runs the session as a Firefox kiosk on it instead of the native
      desktop app.
    default: "0"

variants:
  - name: hermes-agent-dev
    displayName: Hermes-Agent (dev)
    profile: dev
    buildArgs:
      INSTALL_SUDO: "1"
    smoke:
      vnc: true
