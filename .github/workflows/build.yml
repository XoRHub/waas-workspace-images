# build — PR: build the impacted images, smoke, trivy. main: same, plus
# carry-forward of the untouched ones (retag from edge), so every main
# commit carries the full set as g<sha>, and `edge` moves to it.
# Promotion to a release is release.yml.
#
# Static skeleton, dynamic matrices: the toolkit's pipeline action
# (XoRHub/waas-core-images, pinned at actions/v1) decides what to build.
# Two dependency depths: desktops and kiosk apps on a core (layer-0),
# devtools on ubuntu-desktop-noble (layer-1). A deeper tree adds a
# layer-N/scan-N/merge-N set (layer-N needs carry + merge-N-1) and
# raises max-depth. Every job of such a set needs the explicit
# `!cancelled()` guard: `carry` is skipped on a full rebuild and that
# skip propagates to everything downstream of it.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      no_cache:
        description: Rebuild every layer from scratch, ignoring the GHA layer cache.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read

# main runs queue: carry-forward reads `edge`, which the previous run's
# merge must have moved first. PR runs supersede each other.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # qemu routes every build to the amd64 fleet under emulation.
  WAAS_IMAGES_BUILD_STRATEGY: ${{ vars.WAAS_IMAGES_BUILD_STRATEGY || 'native' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # The toolkit's generator materialises the recipe Dockerfiles and
      # the catalog generator imports it.
      - uses: actions/checkout@v7
        with:
          repository: XoRHub/waas-core-images
          ref: actions/v1
          path: .waas-core-images
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Materialise recipe Dockerfiles
        run: uv run .waas-core-images/.github/actions/pipeline/generate_pipeline.py --all --output "${RUNNER_TEMP}/matrices.json"
      - name: hadolint
        run: |
          # shellcheck disable=SC2046
          docker run --rm -v "$PWD:/mnt" -w /mnt ghcr.io/hadolint/hadolint:v2.15.1-alpine \
            hadolint --failure-threshold warning $(find desktop apps -name Dockerfile -o -name Dockerfile.generated)
      - name: shellcheck
        run: shellcheck -S warning ci/*.sh shared/*/*.sh apps/*/rootfs/usr/local/bin/* apps/*/rootfs/etc/waas/entrypoint.d/*.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Unit tests
        env:
          WAAS_CORE_IMAGES_DIR: .waas-core-images
        run: uv run --with pyyaml==6.0.2 --with jsonschema==4.26.0 python -m unittest discover -s ci/tests -v

  setup:
    runs-on: ubuntu-26.04
    outputs:
      layer0: ${{ steps.pipeline.outputs.layer0 }}
      layer1: ${{ steps.pipeline.outputs.layer1 }}
      merge0: ${{ steps.pipeline.outputs.merge0 }}
      merge1: ${{ steps.pipeline.outputs.merge1 }}
      carry: ${{ steps.pipeline.outputs.carry }}
      scan_severity: ${{ steps.pipeline.outputs.scan_severity }}
      scan_ignore_unfixed: ${{ steps.pipeline.outputs.scan_ignore_unfixed }}
      publish: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Diff base: the last green push build of this branch (a failed or
      # cancelled run must not leave its changes unbuilt), or the PR
      # base. None → everything.
      - id: since
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "${GITHUB_EVENT_NAME}" in
            push) since=$(gh run list --workflow build.yml --branch "${GITHUB_REF_NAME}" --event push \
                    --status success --limit 1 --json headSha --jq '.[0].headSha // ""') ;;
            pull_request) since="${PR_BASE}" ;;
            *) since="" ;;
          esac
          echo "since=${since}" >> "$GITHUB_OUTPUT"
      - id: pipeline
        uses: XoRHub/waas-core-images/.github/actions/pipeline@actions/v1
        with:
          since: ${{ steps.since.outputs.since }}
          all: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
          max-depth: 1

  carry:
    needs: setup
    if: needs.setup.outputs.carry != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.carry) }}
    steps:
      - uses: actions/checkout@v7
      - uses: XoRHub/waas-core-images/.github/actions/merge@actions/v1
        with:
          image: ${{ toJSON(matrix) }}
          carry: "true"
          publish: ${{ needs.setup.outputs.publish }}

  layer-0:
    needs: [lint, setup]
    if: needs.setup.outputs.layer0 != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.layer0) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: XoRHub/waas-core-images/.github/actions/build@actions/v1
        with:
          image: ${{ toJSON(matrix) }}
          no-cache: ${{ inputs.no_cache || false }}

  # trivy only inspects the pushed image remotely: always ubuntu-24.04.
  scan-0:
    needs: [setup, layer-0]
    if: needs.setup.outputs.layer0 != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.layer0) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: XoRHub/waas-core-images/.github/actions/scan@actions/v1
        with:
          image: ${{ toJSON(matrix) }}
          severity: ${{ needs.setup.outputs.scan_severity }}
          ignore-unfixed: ${{ needs.setup.outputs.scan_ignore_unfixed }}

  merge-0:
    needs: [setup, layer-0]
    if: needs.setup.outputs.merge0 != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.merge0) }}
    steps:
      - uses: actions/checkout@v7
      - uses: XoRHub/waas-core-images/.github/actions/merge@actions/v1
        with:
          image: ${{ toJSON(matrix) }}
          publish: ${{ needs.setup.outputs.publish }}

  # The parent's g<sha> manifest list must exist: from merge-0 when it
  # was rebuilt, from carry otherwise — either may be skipped, never failed.
  layer-1:
    needs: [lint, setup, carry, merge-0]
    if: >-
      !cancelled()
      && needs.setup.outputs.layer1 != '[]'
      && needs.lint.result == 'success'
      && needs.setup.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.carry.result)
      && contains(fromJSON('["success", "skipped"]'), needs.merge-0.result)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.layer1) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: XoRHub/waas-core-images/.github/actions/build@actions/v1
        with:
          image: ${{ toJSON(matrix) }}
          no-cache: ${{ inputs.no_cache || false }}

  # layer-1 opts into running past a skipped `carry` (empty whenever every
  # image is rebuilt). That skip propagates on down the graph, so its own
  # dependents have to opt in as well — otherwise a full rebuild builds
  # the layer-1 arch tags and then publishes no manifest list for them,
  # and release.yml's promote fails on a g<sha> that was never merged.
  scan-1:
    needs: [setup, layer-1]
    if: >-
      !cancelled()
      && needs.setup.outputs.layer1 != '[]'
      && needs.layer-1.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.layer1) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: XoRHub/waas-core-images/.github/actions/scan@actions/v1
        with:
          image: ${{ toJSON(matrix) }}
          severity: ${{ needs.setup.outputs.scan_severity }}
          ignore-unfixed: ${{ needs.setup.outputs.scan_ignore_unfixed }}

  merge-1:
    needs: [setup, layer-1]
    if: >-
      !cancelled()
      && needs.setup.outputs.merge1 != '[]'
      && needs.layer-1.result == 'success'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.merge1) }}
    steps:
      - uses: actions/checkout@v7
      - uses: XoRHub/waas-core-images/.github/actions/merge@actions/v1
        with:
          image: ${{ toJSON(matrix) }}
          publish: ${{ needs.setup.outputs.publish }}
