- image: ghcr.io/xorhub/waas-workspace-images/hermes-agent:0.5.2
  os: linux
  app: hermes-agent
  version: 0.5.2
  icon: hermes
  displayName: Hermes-Agent (hardened)
  description: Hermes Agent (Nous Research) with its web dashboard in a Firefox kiosk (chat TUI embedded) — self-improving
    AI agent; keys, sessions, memories and skills persist in ~/.hermes on the home volume, and mise installs extra toolchains
    there too, so they survive pod restarts.
  architectures:
  - amd64
  - arm64
  profile: hardened
  recommended:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumes:
    - name: tmp
      mountPath: /tmp
    env:
    - name: WAAS_AUDIO_ENABLED
      description: Enable the unprivileged PulseAudio daemon (native protocol on TCP 4713, consumed by guacd's VNC client)
        — boolean '0'/'1'.
      protocols:
      - vnc
      default: '1'
    - name: WAAS_HERMES_DASHBOARD
      description: Serve the Hermes web dashboard in a Firefox kiosk (127.0.0.1:9119). Boolean '1'/'0'; set '0' to disable
        the server and fall back to the embedded chat TUI.
      default: '1'
