apiVersion: waas.xorhub.io/catalog/v1
images:
- image: ghcr.io/xorhub/waas-workspace-images/chrome:0.5.2
  os: linux
  app: chrome
  version: 0.5.2
  icon: google-chrome
  displayName: Google Chrome
  description: Google Chrome (dl.google.com APT repo, fingerprint pinned) in a single-app kiosk session — no desktop behind
    it; the pod is the sandbox boundary (inner Chrome sandbox disabled).
  architectures:
  - amd64
  profile: hardened
  recommended:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumes:
    - name: tmp
      mountPath: /tmp
    env:
    - name: WAAS_AUDIO_ENABLED
      description: Enable the unprivileged PulseAudio daemon (native protocol on TCP 4713, consumed by guacd's VNC client)
        — boolean '0'/'1'.
      protocols:
      - vnc
      default: '1'
