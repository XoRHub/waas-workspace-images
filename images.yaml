# Global build configuration, merged with every <layer>/*/manifest.yaml
# by the core toolkit's pipeline action (generate_pipeline.py).

# Directories scanned for manifests, in dependency order.
layers: [desktop, apps]

# MAJOR.MINOR of the waas release these images target — the only
# version source in this repo. Releases are X.Y.<n>, n computed from the
# existing vX.Y.* git tags by release.yml. Bumping it is a PR; every
# image is rebuilt (it is a shared input).
release: "0.6"

# External parents, referenced by manifests' `from:`. Pinned tag@digest,
# bumped by Renovate (group "cores").
cores:
  core-ubuntu-noble: ghcr.io/xorhub/waas-core-images/core-ubuntu-noble:1.0.4@sha256:0809a0e438b74b010a9271c36e45ad2374694088391149eb884bc8ec9735a8b1
  core-debian-13: ghcr.io/xorhub/waas-core-images/core-debian-13:1.0.4@sha256:88d80d481f5960b7854e5a6eeb63936d0e771583e8e42921698edac5566f007f
  core-fedora-43: ghcr.io/xorhub/waas-core-images/core-fedora-43:1.0.4@sha256:3ba06eba5dd169eae524038c4ce66756874c67654994d869715f6dbedafa5fd7

# OS keys a manifest may name (`os:`); the OS itself comes from the core.
os:
  ubuntu-noble: {}
  debian-13: {}
  fedora-43: {}

defaults:
  os: ubuntu-noble
  archs: [linux/amd64, linux/arm64]

# Trivy gate (scan action): fail on these severities.
scan:
  severity: HIGH,CRITICAL
  ignoreUnfixed: true
